<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошачьи дела · Менеджер задач</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="app__cat" aria-hidden="true">🐱</div>

        <header class="app__header">
            <h1 class="app__title">Кошачьи дела</h1>
            <p class="app__subtitle">Мяу-менеджер задач · Индивидуальный проект</p>
        </header>

        <form class="task-form" id="task-form">
            <input
                type="text"
                class="task-form__input"
                id="task-input"
                placeholder="Что нужно сделать, ня?"
                autocomplete="off"
                maxlength="120"
            >
            <button type="submit" class="task-form__btn">
                <span>Добавить</span>
                <span class="task-form__btn-paw">🐾</span>
            </button>
        </form>

        <div class="filters" role="tablist">
            <button class="filters__btn filters__btn--active" data-filter="all">Все</button>
            <button class="filters__btn" data-filter="active">Активные</button>
            <button class="filters__btn" data-filter="done">Выполненные</button>
        </div>

        <ul class="task-list" id="task-list"></ul>

        <div class="empty-message" id="empty-message">
            <div class="empty-message__cat">😺</div>
            <p>Мяу! Здесь пока пусто.</p>
            <span>Добавьте первую задачу — и пушистые дела начнутся 🐾</span>
        </div>

        <footer class="app__footer">
            <span id="counter">Всего: 0 · Выполнено: 0</span>
            <button class="clear-btn" id="clear-done">Удалить выполненные</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
